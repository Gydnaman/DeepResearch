[project]
name = "deepresearch-api"
version = "0.1.0"
description = "Mock-first DeepResearch API with bounded LangGraph runs"
readme = "README.md"
authors = [{ name = "DeepResearch" }]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "langgraph==1.2.12",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
]

[project.scripts]
deepresearch-api = "deepresearch_api:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]
